# orders-api (producteur HTTP -> AMQP) et worker (consommateur) — namespace app.
# Stack de départ volontairement vulnérable : root, pas de securityContext,
# dépendances installées au démarrage, identifiants en clair.
apiVersion: v1
kind: ConfigMap
metadata: { name: app-config, namespace: app }
data:
  RABBITMQ_URL: "amqp://app_user:app_password@rabbitmq.messaging.svc.cluster.local:5672/%2Forders"
---
apiVersion: v1
kind: ConfigMap
metadata: { name: app-code, namespace: app }
data:
  orders_api.py: |
    import json, os, uuid
    from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer
    from urllib.parse import urlsplit, parse_qs
    import pika

    URL = os.environ["RABBITMQ_URL"]
    EXCHANGE, ROUTING_KEY = "orders", "order"


    def publish(body: bytes) -> None:
        # Une connexion par requête : pika n'est pas thread-safe.
        conn = pika.BlockingConnection(pika.URLParameters(URL))
        try:
            ch = conn.channel()
            ch.confirm_delivery()
            ch.basic_publish(EXCHANGE, ROUTING_KEY, body,
                             pika.BasicProperties(content_type="application/json", delivery_mode=2),
                             mandatory=True)
        finally:
            conn.close()


    class Handler(BaseHTTPRequestHandler):
        def _reply(self, code, payload):
            data = json.dumps(payload).encode()
            self.send_response(code)
            self.send_header("Content-Type", "application/json")
            self.send_header("Content-Length", str(len(data)))
            self.end_headers()
            self.wfile.write(data)

        def do_GET(self):
            if urlsplit(self.path).path == "/healthz":
                return self._reply(200, {"status": "ok"})
            self._reply(404, {"error": "not found"})

        def do_POST(self):
            url = urlsplit(self.path)
            if url.path != "/orders":
                return self._reply(404, {"error": "not found"})
            raw = self.rfile.read(int(self.headers.get("Content-Length", 0)))

            # ?raw=1 publie le corps sans validation : hook de test de la DLQ.
            if parse_qs(url.query).get("raw") == ["1"]:
                body, order_id = raw, None
            else:
                try:
                    order = json.loads(raw)
                    if not isinstance(order, dict):
                        raise ValueError("objet JSON attendu")
                except ValueError as exc:
                    return self._reply(400, {"error": str(exc)})
                order.setdefault("id", str(uuid.uuid4()))
                body, order_id = json.dumps(order).encode(), order["id"]

            try:
                publish(body)
            except pika.exceptions.AMQPConnectionError:
                return self._reply(503, {"error": "broker injoignable"})
            except (pika.exceptions.UnroutableError, pika.exceptions.NackError):
                return self._reply(502, {"error": "message refusé par le broker"})
            self._reply(202, {"id": order_id})


    ThreadingHTTPServer(("0.0.0.0", 8080), Handler).serve_forever()

  worker.py: |
    import json, os, time
    import pika

    URL = os.environ["RABBITMQ_URL"]
    QUEUE = "orders.q"


    def on_message(ch, method, props, body):
        try:
            order = json.loads(body)
            if not isinstance(order, dict) or "id" not in order:
                raise ValueError("commande sans id")
        except ValueError as exc:
            # requeue=False : le message part vers orders.dlx -> orders.dlq.
            print(f"[DLQ] message rejeté : {exc}", flush=True)
            ch.basic_reject(method.delivery_tag, requeue=False)
            return
        print(f"[OK] commande traitée : {order['id']}", flush=True)
        ch.basic_ack(method.delivery_tag)


    while True:
        try:
            conn = pika.BlockingConnection(pika.URLParameters(URL))
            ch = conn.channel()
            ch.basic_qos(prefetch_count=10)
            ch.basic_consume(QUEUE, on_message)
            print("worker prêt", flush=True)
            ch.start_consuming()
        except pika.exceptions.AMQPError as exc:
            print(f"connexion perdue ({exc!r}), nouvelle tentative dans 5 s", flush=True)
            time.sleep(5)
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: orders-api, namespace: app }
spec:
  replicas: 1
  selector: { matchLabels: { app: orders-api } }
  template:
    metadata: { labels: { app: orders-api } }
    spec:
      automountServiceAccountToken: false
      containers:
      - name: api
        image: python:3.12-slim
        command: ["sh", "-c", "pip install --no-cache-dir --target /deps pika==1.3.2 && exec python /app/orders_api.py"]
        env:
        - { name: PYTHONPATH, value: /deps }
        - { name: PYTHONUNBUFFERED, value: "1" }
        - name: RABBITMQ_URL
          valueFrom: { configMapKeyRef: { name: app-config, key: RABBITMQ_URL } }
        ports: [{ containerPort: 8080 }]
        readinessProbe:
          httpGet: { path: /healthz, port: 8080 }
          initialDelaySeconds: 5
          periodSeconds: 5
        resources:
          requests: { cpu: "100m", memory: "128Mi" }
          limits:   { cpu: "300m", memory: "256Mi" }
        volumeMounts:
        - { name: code, mountPath: /app }
        - { name: deps, mountPath: /deps }
      volumes:
      - { name: code, configMap: { name: app-code } }
      - { name: deps, emptyDir: {} }
---
apiVersion: v1
kind: Service
metadata: { name: orders-api, namespace: app }
spec:
  selector: { app: orders-api }
  ports: [{ port: 80, targetPort: 8080 }]
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: worker, namespace: app }
spec:
  replicas: 1
  selector: { matchLabels: { app: worker } }
  template:
    metadata: { labels: { app: worker } }
    spec:
      automountServiceAccountToken: false
      containers:
      - name: worker
        image: python:3.12-slim
        command: ["sh", "-c", "pip install --no-cache-dir --target /deps pika==1.3.2 && exec python /app/worker.py"]
        env:
        - { name: PYTHONPATH, value: /deps }
        - { name: PYTHONUNBUFFERED, value: "1" }
        - name: RABBITMQ_URL
          valueFrom: { configMapKeyRef: { name: app-config, key: RABBITMQ_URL } }
        resources:
          requests: { cpu: "100m", memory: "128Mi" }
          limits:   { cpu: "300m", memory: "256Mi" }
        volumeMounts:
        - { name: code, mountPath: /app }
        - { name: deps, mountPath: /deps }
      volumes:
      - { name: code, configMap: { name: app-code } }
      - { name: deps, emptyDir: {} }
